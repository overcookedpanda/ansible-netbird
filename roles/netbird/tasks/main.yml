---
# tasks file for netbird
- name: Check for Netbird Installation and version
  ansible.builtin.shell:
    cmd: netbird version
  ignore_errors: true
  register: netbird_installed
  changed_when: false

- name: Set Netbird installation facts
  ansible.builtin.set_fact:
    netbird_is_installed: "{{ netbird_installed.rc == 0 }}"
    netbird_current_version: "{{ netbird_installed.stdout | default('') }}"
    netbird_desired_version_normalized: "{{ netbird_version | regex_replace('^v', '') }}"

- name: Install netbird
  ansible.builtin.shell:
    cmd: curl -fsSL https://pkgs.netbird.io/install.sh | sh
  environment:
    NETBIRD_RELEASE: "{{ netbird_version }}"
  when: not netbird_is_installed

- name: Check NetBird package manager from config
  slurp:
    src: /etc/netbird/install.conf
  register: netbird_config
  failed_when: false
  when:
    - netbird_is_installed
    - netbird_version == "latest" or netbird_desired_version_normalized != netbird_current_version

- name: Update netbird via package manager
  block:
    - name: Update via apt
      ansible.builtin.apt:
        name: "{{ 'netbird=' + netbird_desired_version_normalized if netbird_version != 'latest' else 'netbird' }}"
        state: "{{ 'present' if netbird_version != 'latest' else 'latest' }}"
        update_cache: yes
      become: yes
      when: "'package_manager=apt' in (netbird_config.content | b64decode)"

    - name: Update via dnf
      ansible.builtin.dnf:
        name: "{{ 'netbird-' + netbird_desired_version_normalized if netbird_version != 'latest' else 'netbird' }}"
        state: "{{ 'present' if netbird_version != 'latest' else 'latest' }}"
      become: yes
      when: "'package_manager=dnf' in (netbird_config.content | b64decode)"

    - name: Update via yum
      ansible.builtin.yum:
        name: "{{ 'netbird-' + netbird_desired_version_normalized if netbird_version != 'latest' else 'netbird' }}"
        state: "{{ 'present' if netbird_version != 'latest' else 'latest' }}"
      become: yes
      when: "'package_manager=yum' in (netbird_config.content | b64decode)"

    - name: Update via install script (binary/fallback)
      ansible.builtin.shell:
        cmd: curl -fsSL https://pkgs.netbird.io/install.sh | sh
      environment:
        NETBIRD_RELEASE: "{{ netbird_version }}"
        UPDATE_NETBIRD: "true"
      become: yes
      when: >
        netbird_config.content is not defined or
        not ('package_manager=apt' in (netbird_config.content | b64decode) or
             'package_manager=dnf' in (netbird_config.content | b64decode) or  
             'package_manager=yum' in (netbird_config.content | b64decode))

  when:
    - netbird_is_installed
    - netbird_version == "latest" or netbird_desired_version_normalized != netbird_current_version

- name: Check netbird daemon status
  ansible.builtin.shell:
    cmd: 'netbird status'
  register: netbird_status
  changed_when: false
  ignore_errors: true
  when: netbird_register is true

- name: Build netbird up command
  ansible.builtin.set_fact:
    netbird_up_cmd: >-
      netbird up
      --setup-key="{{ netbird_setup_key }}"
      --management-url="{{ netbird_mgmt_url }}"
      {{ '--allow-server-ssh' if netbird_allow_ssh | bool else '' }}
      {{ '--enable-ssh-sftp' if netbird_allow_ssh | bool and netbird_ssh_sftp | bool else '' }}
      {{ '--enable-ssh-root' if netbird_allow_ssh | bool and netbird_ssh_root | bool else '' }}
      {{ '--enable-ssh-local-port-forwarding' if netbird_allow_ssh | bool and netbird_ssh_local_port_forwarding | bool else '' }}
      {{ '--enable-ssh-remote-port-forwarding' if netbird_allow_ssh | bool and netbird_ssh_remote_port_forwarding | bool else '' }}
      {{ '--disable-ssh-auth' if netbird_allow_ssh | bool and netbird_ssh_disable_auth | bool else '' }}
  when: netbird_register is true

- name: Start Netbird
  become: true
  ansible.builtin.shell: "{{ netbird_up_cmd }}"
  when:
    - netbird_register is true
    - "'NeedsLogin' in netbird_status.stdout or 'LoginFailed' in netbird_status.stdout"

- name: Build netbird SSH reconfigure command
  ansible.builtin.set_fact:
    netbird_ssh_cmd: >-
      netbird up
      --management-url="{{ netbird_mgmt_url }}"
      {{ '--allow-server-ssh' if netbird_allow_ssh | bool else '' }}
      {{ '--enable-ssh-sftp' if netbird_allow_ssh | bool and netbird_ssh_sftp | bool else '' }}
      {{ '--enable-ssh-root' if netbird_allow_ssh | bool and netbird_ssh_root | bool else '' }}
      {{ '--enable-ssh-local-port-forwarding' if netbird_allow_ssh | bool and netbird_ssh_local_port_forwarding | bool else '' }}
      {{ '--enable-ssh-remote-port-forwarding' if netbird_allow_ssh | bool and netbird_ssh_remote_port_forwarding | bool else '' }}
      {{ '--disable-ssh-auth' if netbird_allow_ssh | bool and netbird_ssh_disable_auth | bool else '' }}
  when:
    - netbird_register is true
    - netbird_allow_ssh | bool

- name: Check if SSH server is enabled
  ansible.builtin.shell:
    cmd: 'netbird status | grep "SSH Server"'
  register: netbird_ssh_status
  changed_when: false
  failed_when: false
  when:
    - netbird_register is true
    - netbird_allow_ssh | bool
    - "'Connected' in netbird_status.stdout or 'Connecting' in netbird_status.stdout"

- name: Reconfigure Netbird with SSH flags
  become: true
  ansible.builtin.shell: |
    netbird down
    sleep 3
    {{ netbird_ssh_cmd }}
  when:
    - netbird_register is true
    - netbird_allow_ssh | bool
    - "'Connected' in netbird_status.stdout or 'Connecting' in netbird_status.stdout"
    - netbird_ssh_status.stdout is defined
    - "'Disabled' in netbird_ssh_status.stdout or 'SSH Server' not in netbird_ssh_status.stdout"
